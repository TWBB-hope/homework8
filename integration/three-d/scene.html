<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园三维导览 · 迷你版校园信息中心</title>
<meta name="description" content="课堂作业八案例复现第三步：Three.js 校园地标三维区">
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #23282d; background: #f6f7f9; }
  header { background: #2f6f8f; color: #fff; padding: .65rem 1rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: baseline; }
  header a { color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.5); }
  main { padding: 1rem; max-width: 1100px; margin: 0 auto; }
  #stage { width: 100%; height: 460px; background: linear-gradient(#cfe3ef, #eef4f7); border: 1px solid #dfe3e8; border-radius: .5rem; overflow: hidden; }
  #stage canvas { display: block; }
  .panel { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; margin: .75rem 0; font-size: .9rem; }
  .hint { color: #6c757d; font-size: .85rem; }
  .alert { background: #f8d7da; color: #842029; padding: .75rem 1rem; border-radius: .5rem; }
  footer { padding: 1rem; color: #6c757d; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <strong>校园三维导览</strong>
  <span class="hint">迷你版校园信息中心 · 案例复现</span>
  <nav aria-label="返回导航" style="margin-left:auto">
    <a href="../index.html">&larr; 返回信息中心首页</a>
  </nav>
</header>

<main>
  <h1>校园地标三维场景</h1>
  <p>把课堂七的 Three.js 场景作为综合作品的“校园三维”入口：点击地标查看名称，拖拽旋转视角，滚轮缩放。</p>
  <div id="stage"></div>
  <div class="panel">
    <span>当前选中：<strong id="picked">无</strong></span>
    <span>提示：左键拖拽旋转 / 滚轮缩放 / 点击地标选中</span>
  </div>
  <div id="fallback"></div>
</main>

<footer>数据与几何体均为课堂练习用的示意模型，不对应真实校园建筑。</footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>if (!window.THREE) document.write('<script src="../../vendor/three.min.js"><\/script>');</script>
<script src="scene.js"></script>
</body>
</html>
